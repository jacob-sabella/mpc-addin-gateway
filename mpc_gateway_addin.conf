# mpc-addin-gateway settings (key=value; this file sits next to mpc_gateway_addin.so). Read when MPC starts.
# The addin runs Caddy beside MPC, while MPC runs, as one HTTPS front door with one password for the web servers other
# addins run on the device (which keep listening on the device only), and stops it when MPC exits.
enabled=1
# The address the gateway listens on. 127.0.0.1: this device only (ssh -N -L 8443:127.0.0.1:443 root@<device>, then
# https://localhost:8443). 0.0.0.0: every network the device is on; anyone who can reach it must give the password.
bind=127.0.0.1
# The HTTPS port. 443 by default (MPC's own web server has 80).
port=443
# The login. Both are mpc when empty: change the password before opening the gateway to a network (bind=0.0.0.0).
# The password: no spaces, quotes or backslashes. The settings page (Settings on the start page) edits this whole file;
# a change made here by hand takes effect at MPC's next start.
user=
password=
# Addins that declare a web service in their addin.manifest are listed and routed on their own: under their path of
# this port, or on a port of their own (theirs + 10000). forward= adds your own, for servers that declare nothing, as
# name:local_port:gateway_port separated by spaces (the local server on 127.0.0.1). Your own routes inside the main
# site go in routes.d/<name>.caddy in this folder (Caddyfile directives; one Caddy refuses is skipped).
forward=
# Caddy's nice value (0..19, higher is gentler). It also always runs in the idle disk class, on one CPU core.
nice=19
# A soft memory limit for Caddy, in MB.
memory_mb=64
# How often to look again at the addins' services (installed, removed, running) and the network addresses (a new
# Wi-Fi network; the certificates follow them), in seconds.
rescan_s=10
# A file to append Caddy's and the addin's log to (an absolute path; empty: no log).
log=
# A Caddyfile of your own, used instead of the one made from this file and the routes (everything above but enabled,
# nice and memory_mb is then ignored). Empty: the one made from this file.
config=
# The folder that holds every addin's folder, read for their addin.manifest. Empty: this folder's parent.
addins_dir=
